apiVersion: v1
kind: Service
metadata:
  name: promptwall
  namespace: default
  labels:
    app.kubernetes.io/name: promptwall
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: promptwall-enterprise
spec:
  type: ClusterIP
  selector:
    app: promptwall
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
