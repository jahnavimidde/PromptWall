  GEMINI_API_KEY: "CHANGE_ME_GEMINI_KEY"
  JWT_SECRET: "CHANGE_ME_PRODUCTION_JWT_SECRET_32_CHARS"
  PROMETHEUS_AUTH_TOKEN: "CHANGE_ME_PROMETHEUS_SCRAPE_BEARER_TOKEN"
