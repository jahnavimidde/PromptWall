  labels:
    app.kubernetes.io/name: promptwall
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: promptwall-enterprise
type: Opaque
# CAUTION: Replace placeholder values with base64-encoded production secrets or manage via Vault / ExternalSecrets
stringData:
  OPENAI_API_KEY: "CHANGE_ME_OPENAI_KEY"
