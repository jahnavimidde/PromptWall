apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptwall
  namespace: default
  labels:
    app.kubernetes.io/name: promptwall
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: promptwall-enterprise
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: promptwall
  template:
    metadata:
      labels:
        app: promptwall
        app.kubernetes.io/name: promptwall
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: promptwall
          image: ghcr.io/sgasser/pasteguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: promptwall-config
            - secretRef:
                name: promptwall-secret
          volumeMounts:
            - name: promptwall-data
              mountPath: /pasteguard/data
      volumes:
        - name: promptwall-data
          emptyDir: {}
